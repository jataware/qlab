[project]
authors = [{name = "bkj", email = "bkj.322@gmail.com"}]
dependencies = ["pillow>=10.1"]
description = "Local browser-based image annotation tool"
name = "qlab"
readme = "README.md"
requires-python = ">= 3.9"
version = "0.1.0"

[project.scripts]
qlab = "qlab.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
include = [
  "src/qlab/**",
  "annotate_images.py",
  "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qlab"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/qlab",
  "/annotate_images.py",
  "/README.md",
  "/pyproject.toml",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
qlab = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pip = ">=26.0.1,<27"
